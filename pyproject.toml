[project]
name = "coffee-map"
version = "0.1.0"
description = "A web map of every coffee shop in a city, built from scraped open data"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "patchright>=1.63",
    "prettymaps==1.3.2",
]

[project.scripts]
coffeemap = "coffeemap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# prettymaps (<=1.3.2) pins numpy<1.25, which has no wheels for Python >=3.12.
# osmnx 1.9.x / shapely 2 / matplotlib>=3.9 all support numpy 2, so override the pin.
[tool.uv]
override-dependencies = ["numpy>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffeemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
