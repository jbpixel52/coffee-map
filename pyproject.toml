[project]
name = "coffee-map"
version = "0.1.0"
description = "A web map of every coffee shop in a city, built from scraped open data"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "patchright>=1.63",
]

[project.scripts]
coffeemap = "coffeemap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffeemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
