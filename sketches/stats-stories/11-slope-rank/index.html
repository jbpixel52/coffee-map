<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Same city, different rank — coffee-map stats sketch</title>
<style>:root {
  /* — Pantone NYFW SS27 ————————————————————————————————— */
  --antique-white: #eee5d3; /* 11-0105  ground */
  --dolphin: #9a9699; /* 16-2901  borders, recessive marks */
  --blue-indigo: #49516d; /* 19-3928  ink, primary */
  --tarragon: #a4ae77; /* 15-0326  parks, success */
  --waterfall: #3ab0a2; /* 15-5516  water, one avatar hue */
  --arrowwood: #bc8d1f; /* 16-0954  heat mid, figures */
  --langoustino: #ca6c56; /* 16-1440  heat mid-high */
  --chili-pepper: #9b1b30; /* 19-1557  warning, "sin Instagram" */
  --lavender-oil: #c3a6cd; /* 15-3615  night accent, settings */
  --rosy-future: #f37e9b; /* 15-1910  night warning */
  --anise-flower: #f4e3b5; /* 12-0717  heat floor */
  --princess-blue: #00539c; /* 19-4150  links, avatars */
  --dragon-fire: #fd652d; /* 16-1460  heat button, destructive-ish */
  --daiquiri-green: #c9d77e; /* 12-0435  avatars */
  --hibiscus: #de3848; /* 18-1762  avatars */

  /* — surfaces & ink ———————————————————————————————————— */
  --background: var(--antique-white);
  --surface: #f7f3eb;
  --surface-2: #efe9dd;
  --border: #cbc4bb;
  --border-input: #c0b8ae;
  --fg: var(--blue-indigo);
  --fg-muted: #606479;
  --primary: var(--blue-indigo);
  --primary-fg: #f7f3eb;
  --accent: var(--chili-pepper); /* 19-1557 */
  --accent-fg: #fbf3ee;
  --accent-soft: #e2c7bb;
  --accent-text: var(--chili-pepper);
  --warn: var(--chili-pepper);
  --ring: var(--waterfall);

  /* — shape & depth ————————————————————————————————————— */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow-sm: 0 1px 2px 0 rgb(24 22 30 / 0.07);
  --shadow: 0 6px 20px -6px rgb(24 22 30 / 0.22), 0 2px 6px -2px rgb(24 22 30 / 0.08);

  --top-h: 96px;
  --step-1: 11.5px;
  --step-2: 12.5px;
  --step-3: 13.5px;
  --step-4: 15px;
  --step-5: 20px;
  --step-6: 26px;

  color-scheme: light;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
@font-face{font-family:"Hanken Grotesk";src:url("../assets/hanken-grotesk-latin.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap}
body{font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  background:var(--antique-white);color:var(--blue-indigo);-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:flex;flex-direction:column;padding:22px 26px;gap:14px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.top h1{font-size:19px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.stance{margin-left:auto;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
  color:var(--chili-pepper);border:1px solid var(--accent-soft);border-radius:999px;padding:4px 9px}
.stamp{font-size:9.5px;letter-spacing:.08em;color:var(--fg-muted);text-transform:uppercase;white-space:nowrap}
.canvas{flex:1;min-height:0;position:relative;overflow:hidden}
.note{flex:0 0 auto;font-size:11px;line-height:1.45;color:var(--fg-muted);
  border-top:1px solid var(--border);padding-top:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}

    .slopewrap{position:absolute;inset:0;display:grid;place-items:center}
    svg{height:100%}
    .sl{font-size:10.5px;fill:var(--blue-indigo)}
    .hd{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;fill:var(--fg-muted)}
    </style></head>
<body><div class="wrap">
  <div class="top"><h1>Same city, different rank</h1><span class="stance">analytical</span>
    <span class="stamp">real census · 8,681 shops</span></div>
  <div class="canvas"><div class="slopewrap"><svg viewBox="0 0 560 420">
      <text x="120" y="20" text-anchor="end" class="hd">by shops</text>
      <text x="428" y="20" class="hd">by density</text>
      <line x1="120" y1="34" x2="420" y2="102" stroke="var(--chili-pepper)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="38" text-anchor="end" class="sl">New York City</text>
            <text x="428" y="106" class="sl">New York City</text><line x1="120" y1="68" x2="420" y2="204" stroke="var(--chili-pepper)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="72" text-anchor="end" class="sl">Los Angeles</text>
            <text x="428" y="208" class="sl">Los Angeles</text><line x1="120" y1="102" x2="420" y2="272" stroke="var(--chili-pepper)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="106" text-anchor="end" class="sl">Mexico City</text>
            <text x="428" y="276" class="sl">Mexico City</text><line x1="120" y1="136" x2="420" y2="34" stroke="var(--waterfall)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="140" text-anchor="end" class="sl">San Francisco</text>
            <text x="428" y="38" class="sl">San Francisco</text><line x1="120" y1="170" x2="420" y2="68" stroke="var(--waterfall)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="174" text-anchor="end" class="sl">Seattle</text>
            <text x="428" y="72" class="sl">Seattle</text><line x1="120" y1="204" x2="420" y2="238" stroke="var(--chili-pepper)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="208" text-anchor="end" class="sl">San Diego</text>
            <text x="428" y="242" class="sl">San Diego</text><line x1="120" y1="238" x2="420" y2="306" stroke="var(--chili-pepper)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="242" text-anchor="end" class="sl">Tijuana</text>
            <text x="428" y="310" class="sl">Tijuana</text><line x1="120" y1="272" x2="420" y2="136" stroke="var(--waterfall)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="276" text-anchor="end" class="sl">Oakland</text>
            <text x="428" y="140" class="sl">Oakland</text><line x1="120" y1="306" x2="420" y2="340" stroke="var(--chili-pepper)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="310" text-anchor="end" class="sl">Austin</text>
            <text x="428" y="344" class="sl">Austin</text><line x1="120" y1="340" x2="420" y2="170" stroke="var(--waterfall)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="344" text-anchor="end" class="sl">Guadalajara</text>
            <text x="428" y="174" class="sl">Guadalajara</text><line x1="120" y1="374" x2="420" y2="374" stroke="var(--waterfall)" stroke-opacity=".55" stroke-width="2"/>
            <text x="112" y="378" text-anchor="end" class="sl">Ensenada</text>
            <text x="428" y="378" class="sl">Ensenada</text></svg></div></div>
  <div class="note">Slope chart of a city's rank by total shops versus by density. Pro: exposes how the leaderboard flips (New York falls, San Francisco climbs). Con: eleven labels per side is crowded — cap it at the movers.</div>
</div></body></html>
