<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>ZIP atlas — coffee-map stats sketch</title>
<style>:root {
  /* — Pantone NYFW SS27 ————————————————————————————————— */
  --antique-white: #eee5d3; /* 11-0105  ground */
  --dolphin: #9a9699; /* 16-2901  borders, recessive marks */
  --blue-indigo: #49516d; /* 19-3928  ink, primary */
  --tarragon: #a4ae77; /* 15-0326  parks, success */
  --waterfall: #3ab0a2; /* 15-5516  water, one avatar hue */
  --arrowwood: #bc8d1f; /* 16-0954  heat mid, figures */
  --langoustino: #ca6c56; /* 16-1440  heat mid-high */
  --chili-pepper: #9b1b30; /* 19-1557  warning, "sin Instagram" */
  --lavender-oil: #c3a6cd; /* 15-3615  night accent, settings */
  --rosy-future: #f37e9b; /* 15-1910  night warning */
  --anise-flower: #f4e3b5; /* 12-0717  heat floor */
  --princess-blue: #00539c; /* 19-4150  links, avatars */
  --dragon-fire: #fd652d; /* 16-1460  heat button, destructive-ish */
  --daiquiri-green: #c9d77e; /* 12-0435  avatars */
  --hibiscus: #de3848; /* 18-1762  avatars */

  /* — surfaces & ink ———————————————————————————————————— */
  --background: var(--antique-white);
  --surface: #f7f3eb;
  --surface-2: #efe9dd;
  --border: #cbc4bb;
  --border-input: #c0b8ae;
  --fg: var(--blue-indigo);
  --fg-muted: #606479;
  --primary: var(--blue-indigo);
  --primary-fg: #f7f3eb;
  --accent: var(--chili-pepper); /* 19-1557 */
  --accent-fg: #fbf3ee;
  --accent-soft: #e2c7bb;
  --accent-text: var(--chili-pepper);
  --warn: var(--chili-pepper);
  --ring: var(--waterfall);

  /* — shape & depth ————————————————————————————————————— */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow-sm: 0 1px 2px 0 rgb(24 22 30 / 0.07);
  --shadow: 0 6px 20px -6px rgb(24 22 30 / 0.22), 0 2px 6px -2px rgb(24 22 30 / 0.08);

  --top-h: 96px;
  --step-1: 11.5px;
  --step-2: 12.5px;
  --step-3: 13.5px;
  --step-4: 15px;
  --step-5: 20px;
  --step-6: 26px;

  color-scheme: light;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
@font-face{font-family:"Hanken Grotesk";src:url("../assets/hanken-grotesk-latin.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap}
body{font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  background:var(--antique-white);color:var(--blue-indigo);-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:flex;flex-direction:column;padding:22px 26px;gap:14px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.top h1{font-size:19px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.stance{margin-left:auto;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
  color:var(--chili-pepper);border:1px solid var(--accent-soft);border-radius:999px;padding:4px 9px}
.stamp{font-size:9.5px;letter-spacing:.08em;color:var(--fg-muted);text-transform:uppercase;white-space:nowrap}
.canvas{flex:1;min-height:0;position:relative;overflow:hidden}
.note{flex:0 0 auto;font-size:11px;line-height:1.45;color:var(--fg-muted);
  border-top:1px solid var(--border);padding-top:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}

    .atlas{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px}
    .zip{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
      padding:10px;display:flex;flex-direction:column;gap:8px}
    .grid{flex:1;min-height:0;border-radius:var(--radius-md);display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px;
      background:
        linear-gradient(color-mix(in srgb,var(--arrowwood) calc(var(--heat)*60%),var(--anise-flower)),
                        color-mix(in srgb,var(--langoustino) calc(var(--heat)*70%),var(--anise-flower)));
      border:1px solid color-mix(in srgb,var(--arrowwood) 30%,transparent)}
    .grid b{font-size:26px;font-variant-numeric:tabular-nums}
    .grid span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
    figcaption{display:flex;flex-direction:column;gap:1px;margin:0}
    figcaption strong{font-size:12.5px}
    figcaption span{font-size:10px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    </style></head>
<body><div class="wrap">
  <div class="top"><h1>ZIP atlas</h1><span class="stance">map-first</span>
    <span class="stamp">real census · 8,681 shops</span></div>
  <div class="canvas"><div class='atlas'><figure class="zip"><div class="grid" style="--heat:1.00">
              <b>166</b><span>ZIPs</span></div>
              <figcaption><strong>New York City</strong>
              <span>16.1 cafés/ZIP · busiest 10003 ×73</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.49">
              <b>230</b><span>ZIPs</span></div>
              <figcaption><strong>Los Angeles</strong>
              <span>5.1 cafés/ZIP · busiest 90012 ×36</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.47">
              <b>88</b><span>ZIPs</span></div>
              <figcaption><strong>Mexico City</strong>
              <span>11.9 cafés/ZIP · busiest 06600 ×34</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.68">
              <b>31</b><span>ZIPs</span></div>
              <figcaption><strong>San Francisco</strong>
              <span>25.4 cafés/ZIP · busiest 94122 ×50</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.84">
              <b>58</b><span>ZIPs</span></div>
              <figcaption><strong>Seattle</strong>
              <span>13.3 cafés/ZIP · busiest 98122 ×61</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.59">
              <b>51</b><span>ZIPs</span></div>
              <figcaption><strong>San Diego</strong>
              <span>13.2 cafés/ZIP · busiest 92101 ×43</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.07">
              <b>64</b><span>ZIPs</span></div>
              <figcaption><strong>Tijuana</strong>
              <span>9.8 cafés/ZIP · busiest 22040 ×5</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.37">
              <b>20</b><span>ZIPs</span></div>
              <figcaption><strong>Oakland</strong>
              <span>19.2 cafés/ZIP · busiest 94704 ×27</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.37">
              <b>60</b><span>ZIPs</span></div>
              <figcaption><strong>Austin</strong>
              <span>5.3 cafés/ZIP · busiest 78701 ×27</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.10">
              <b>24</b><span>ZIPs</span></div>
              <figcaption><strong>Guadalajara</strong>
              <span>8.4 cafés/ZIP · busiest 44160 ×7</span></figcaption>
            </figure><figure class="zip"><div class="grid" style="--heat:0.04">
              <b>3</b><span>ZIPs</span></div>
              <figcaption><strong>Ensenada</strong>
              <span>9.0 cafés/ZIP · busiest 22800 ×3</span></figcaption>
            </figure></div></div>
  <div class="note">A card per city with its ZIP count and busiest postal code, heat-tinted. Pro: makes 'cafés per ZIP' tangible and points at a real place. Con: a card is not a map — the honest version is a real ZIP choropleth.</div>
</div></body></html>
