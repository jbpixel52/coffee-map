<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cafés de Tijuana — mapa</title>
  </head>
  <body>
    <header id="topbar">
      <strong>Cafés de Tijuana</strong>
      <input id="q" type="search" placeholder="Buscar café…" autocomplete="off" />
      <label><input id="only-ig" type="checkbox" /> Con Instagram</label>
      <span id="count"></span>
    </header>
    <div id="map"></div>
    <!-- screen-space paper: multiplies over the canvas so the whole map sits
         on visible paper even between texture tiles -->
    <div id="paper" aria-hidden="true"></div>
    <!-- painted-at-rest post-process: turbulence-displaced canvas edge so
         vector geometry stops looking mechanically straight -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="wc-paint" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.021 0.026" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
        <feGaussianBlur stdDeviation="0.14" />
      </filter>
    </svg>
    <footer id="attrib">
      Datos: © OpenStreetMap contributors (ODbL) · Google Maps · Instagram —
      Mapa: acuarela (estilo propio) sobre OpenFreeMap —
      <span id="generated"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
